<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singcat MIDI Player</title>
    <style>
      :root { --bg: #0f172a; --panel: #111827; --text: #e5e7eb; --muted: #9ca3af; --accent: #8b5cf6; --border: rgba(148,163,184,.2); }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 24px; color: var(--text); font-family: Arial, sans-serif; background: radial-gradient(circle at top,#1e293b 0%,var(--bg) 48%,#020817 100%); }
      main { width: min(980px,100%); margin: auto; padding: 28px; border: 1px solid var(--border); border-radius: 20px; background: rgba(15,23,42,.88); box-shadow: 0 25px 50px rgba(15,23,42,.45); }
      h1 { margin: 0 0 8px; font-size: clamp(2rem,5vw,3.6rem); }
      h2 { margin: 0 0 14px; font-size: 1.1rem; }
      p { color: var(--muted); line-height: 1.6; }
      
      .drop-zone { padding: 32px 20px; text-align: center; border: 2px dashed #64748b; border-radius: 16px; cursor: pointer; background: rgba(139,92,246,.08); display: block; }
      .drop-zone.dragging { border-color: #c4b5fd; background: rgba(139,92,246,.2); }
      .drop-zone strong { color: #c4b5fd; }
      
      /* Progress Bar Styles */
      #progress-container { display: none; width: 100%; background: rgba(255,255,255,0.05); border-radius: 8px; overflow: hidden; margin: 16px 0; height: 12px; border: 1px solid var(--border); }
      #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), #c4b5fd); transition: width 0.3s ease; box-shadow: 0 0 10px rgba(139,92,246,.5); }
      
      .toolbar, .track-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .toolbar { margin: 18px 0; }
      button { padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; color: var(--text); background: transparent; cursor: pointer; font-weight: 700; transition: all 0.2s; }
      button.primary { border: 0; background: linear-gradient(135deg,var(--accent),#a78bfa); }
      button:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
      button:disabled { cursor: not-allowed; opacity: .45; background: #374151; }
      .status { min-height: 1.4em; color: var(--muted); font-weight: 600; }
      
      .tracks { display: grid; gap: 10px; }
      .track { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: rgba(31,41,55,.72); }
      .track-name { font-weight: 700; display: flex; align-items: center; }
      .track-meta { display: block; margin-top: 4px; color: var(--muted); font-size: .85rem; }
      
      /* Status Ready/Loading Indicator */
      .track-status { font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: bold; margin-left: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
      .track-status.ready { background: rgba(16, 185, 129, 0.2); color: #34d399; }
      .track-status.loading { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
      
      .track-actions button { padding: 7px 10px; font-size: .8rem; }
      .soundfont-mark { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
      .soundfont-mark button { padding: 5px 7px; font-size: .72rem; }
      .soundfont-mark button.active { border-color: #c4b5fd; color: #c4b5fd; background: rgba(139,92,246,.2); }
      .soundfont-label { display: block; margin-top: 8px; color: var(--muted); font-size: .75rem; }
      .volume-control { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: .75rem; }
      .volume-control input { width: 130px; accent-color: var(--accent); }
      .empty { padding: 20px; color: var(--muted); text-align: center; border: 1px solid var(--border); border-radius: 12px; }
      .server { margin-top: 20px; color: var(--muted); font-size: .85rem; }
      @media (max-width: 650px) { main { padding: 20px; } .track { grid-template-columns: auto 1fr; } .track-actions { grid-column: 2; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Singcat MIDI Player</h1>
      <p>Jatuhkan satu file MIDI untuk mengubahnya langsung menjadi JSON, melakukan caching instrumen, dan memilih channel yang ingin dimainkan tanpa lag.</p>

      <label class="drop-zone" id="drop-zone" for="midi-file">
        <strong>Drag & drop file MIDI di sini</strong><br />
        atau klik untuk memilih file
        <input id="midi-file" type="file" accept=".mid,.midi,audio/midi" hidden />
      </label>

      <!-- Progress Bar untuk Loading & Caching MIDI ke JSON -->
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>

      <div class="toolbar">
        <button class="primary" id="play-selected" type="button" disabled>Play yang dipilih</button>
        <button id="stop-all" type="button" disabled>Stop semua</button>
        <label class="volume-control">Volume global <input id="global-volume" type="range" min="0" max="100" value="100"><span id="global-volume-value">100%</span></label>
        <label class="volume-control">Kecepatan <input id="playback-speed" type="range" min="50" max="150" step="1" value="100"><span id="playback-speed-value">100%</span></label>
        <button id="reset-speed" type="button">Reset tempo</button>
        <label class="volume-control">Nada global <input id="global-pitch" type="range" min="-12" max="12" step="1" value="0"><span id="global-pitch-value">0</span></label>
        <button id="reset-pitch" type="button">Reset nada</button>
        <button id="save-json" class="primary" type="button">Simpan JSON & Audio HD</button>
        <span id="song-name" class="status" style="display: block; width: 100%; margin-top: 10px;">Belum ada MIDI dimuat.</span>
      </div>

      <section>
        <h2>Channel dan instrumen</h2>
        <div id="tracks" class="tracks"><div class="empty">Muat file MIDI untuk melihat channel.</div></div>
      </section>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="server">Server: <span id="server-status">connecting...</span></div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
      import { Midi } from "https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/+esm";
      import { WorkletSynthesizer } from "https://esm.sh/spessasynth_lib@4.3.14";

      const STORAGE_KEY = "singcat-midi-rules";
      
      // Default soundfont sekarang adalah ChoriumRevA
      const DEFAULT_SOUNDFONT = "ChoriumRevA.sf2";
      const SOUNDFONTS = [
        { file: "ChoriumRevA.sf2", label: "Chorium (Default)" },
        { file: "Thurston_Waffles.sf2", label: "Thurston" },
        { file: "MEOW.sf2", label: "MEOW" },
        { file: "Cat_Meow.sf2", label: "Cat Meow" }
      ];

      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("midi-file");
      const tracksElement = document.getElementById("tracks");
      const statusElement = document.getElementById("status");
      const songNameElement = document.getElementById("song-name");
      const playSelectedButton = document.getElementById("play-selected");
      const stopAllButton = document.getElementById("stop-all");
      
      const progressContainer = document.getElementById("progress-container");
      const progressBar = document.getElementById("progress-bar");

      let songData = null;
      let currentFilename = "";
      let audioContext = null;
      let scheduledSources = [];
      let finishTimer = null;
      let processorLoaded = false;
      let playbackState = null;
      let masterGain = null;
      let recordingDestination = null;
      const soundfontSynthesizers = new Map();

      const savedRules = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      const saveRules = (rules) => localStorage.setItem(STORAGE_KEY, JSON.stringify(rules));
      const trackKey = (track, index) => `${index}:${track.channel}:${track.instrument.number}:${track.instrument.name}`;
      
      const getTrackVolume = (track, rules, key) => (
        rules.tracks?.[key]?.volume
        ?? track.volume
        ?? track.playback?.volume
        ?? 100
      );
      
      const getTrackSoundfont = (track, rules, key) => {
        const trackRules = rules.tracks?.[key];
        if (trackRules && Object.prototype.hasOwnProperty.call(trackRules, "soundfont")) {
          return trackRules.soundfont || DEFAULT_SOUNDFONT;
        }
        return track.soundfont ?? track.playback?.soundfont ?? DEFAULT_SOUNDFONT;
      };
      
      const getGlobalVolume = () => savedRules()[currentFilename]?.globalVolume ?? 100;
      const getPlaybackSpeed = () => savedRules()[currentFilename]?.playbackSpeed ?? 100;
      const getGlobalPitch = () => savedRules()[currentFilename]?.globalPitch ?? 0;
      
      const persistVolume = (key, volume) => {
        const allRules = savedRules();
        const current = allRules[currentFilename] || {};
        allRules[currentFilename] = { ...current, tracks: { ...(current.tracks || {}), [key]: { ...(current.tracks?.[key] || {}), volume } } };
        saveRules(allRules);
      };

      function stopAll(message = "Playback dihentikan.") {
        scheduledSources.forEach((source) => {
          try { source.stop(); } catch (error) { if (error.name !== "InvalidStateError") console.error(error); }
        });
        scheduledSources = [];
        soundfontSynthesizers.forEach((synth) => synth.stopAll(true));
        clearTimeout(finishTimer);
        playbackState = null;
        statusElement.textContent = message;
      }

      async function getSoundfontSynthesizer(soundfontFile) {
        if (!audioContext) audioContext = new AudioContext();
        
        if (!soundfontSynthesizers.has(soundfontFile)) {
          const processorUrl = "/assets/spessasynth/spessasynth_processor.min.js";
          if (!processorLoaded) {
            await audioContext.audioWorklet.addModule(processorUrl);
            processorLoaded = true;
          }
          const synth = new WorkletSynthesizer(audioContext);
          masterGain = masterGain || audioContext.createGain();
          masterGain.connect(audioContext.destination);
          masterGain.gain.value = getGlobalVolume() / 100;
          
          synth.connect(masterGain);
          
          const response = await fetch(`/assets/${encodeURIComponent(soundfontFile)}`);
          if (!response.ok) {
            throw new Error(`SoundFont ${soundfontFile} gagal dimuat (${response.status}). Pastikan file berada di D:\\singcat\\publick\\assets\\`);
          }
          await synth.soundBankManager.addSoundBank(await response.arrayBuffer(), soundfontFile);
          await synth.isReady;
          soundfontSynthesizers.set(soundfontFile, synth);
        }
        return soundfontSynthesizers.get(soundfontFile);
      }

      // Preload Function: Mengubah MIDI ke JSON sekaligus caching semua instrumen
      async function preloadInstruments(isConverted) {
        const rules = savedRules()[currentFilename] || {};
        const requiredFonts = new Set();
        
        songData.tracks.forEach((track, index) => {
          const sf = getTrackSoundfont(track, rules, trackKey(track, index));
          requiredFonts.add(sf);
        });

        let loaded = 0;
        const total = requiredFonts.size;
        
        progressContainer.style.display = "block";
        progressBar.style.width = "0%";
        
        for (const sf of requiredFonts) {
          statusElement.textContent = `Memproses JSON & Memuat Instrumen: ${sf}...`;
          try {
            await getSoundfontSynthesizer(sf);
          } catch (e) {
            console.error(e);
            statusElement.textContent = `Error memuat ${sf}`;
          }
          loaded++;
          progressBar.style.width = `${(loaded / total) * 100}%`;
        }

        setTimeout(() => progressContainer.style.display = "none", 600);
        
        const convertedText = isConverted ? "MIDI berhasil dikonversi ke JSON." : "Data JSON dimuat.";
        statusElement.textContent = `Global Status: READY! ${convertedText} Semua instrumen telah di-cache.`;
        
        playSelectedButton.disabled = false;
        stopAllButton.disabled = false;
      }

      async function playTracks(trackIndexes, offset = 0, isContinuation = false, speed = getPlaybackSpeed(), pitch = getGlobalPitch()) {
        if (!songData || trackIndexes.length === 0) {
          statusElement.textContent = "Pilih setidaknya satu channel.";
          return;
        }
        try {
          stopAll("");
          audioContext = audioContext || new AudioContext();
          await audioContext.resume();
          masterGain = masterGain || audioContext.createGain();
          masterGain.connect(audioContext.destination);
          masterGain.gain.value = getGlobalVolume() / 100;
          
          const rules = savedRules()[currentFilename] || {};
          playbackState = { trackIndexes, startedAt: performance.now(), offset, speed, pitch };
          
          await Promise.all(trackIndexes.map(async (index) => {
            const track = songData.tracks[index];
            const key = trackKey(track, index);
            
            // Seluruh channel menggunakan Soundfont (ChoriumRevA atau Soundfont Kucing), oscillator dihapus total
            const soundfontFile = getTrackSoundfont(track, rules, key);
            const soundfontSynth = await getSoundfontSynthesizer(soundfontFile);
            const trackVolume = getTrackVolume(track, rules, key);
            
            if (soundfontSynth) {
              soundfontSynth.controllerChange(track.channel, 7, Math.round(trackVolume * 1.27));
              track.notes.forEach((note) => {
                if (note.time + note.duration <= offset) return;
                
                const relativeTime = Math.max(0, note.time - offset) / (speed / 100);
                const noteStart = relativeTime * 1000;
                const noteEnd = Math.max(noteStart + 20, ((note.time + note.duration - offset) / (speed / 100)) * 1000);
                
                const startTimer = setTimeout(() => {
                  soundfontSynth.programChange(track.channel, track.instrument.number);
                  soundfontSynth.noteOn(track.channel, note.midi + pitch, Math.round(note.velocity * 127));
                }, noteStart);
                
                const endTimer = setTimeout(() => soundfontSynth.noteOff(track.channel, note.midi + pitch), noteEnd);
                
                scheduledSources.push({ 
                  stop: () => { 
                    clearTimeout(startTimer); 
                    clearTimeout(endTimer); 
                    soundfontSynth.noteOff(track.channel, note.midi + pitch); 
                  } 
                });
              });
            }
          }));
          
          statusElement.textContent = `${isContinuation ? "Melanjutkan" : "Memainkan"} ${trackIndexes.length} channel dari ${currentFilename}.`;
          
          finishTimer = setTimeout(() => {
            scheduledSources = [];
            playbackState = null;
            statusElement.textContent = "Playback selesai. Global Status: Ready.";
          }, Math.max(0.2, (songData.duration - offset) / (speed / 100) + .2) * 1000);
          return true;
        } catch (error) {
          stopAll("Playback gagal.");
          console.error(error);
          return false;
        }
      }

      function renderTracks(isReady = false) {
        const rules = savedRules()[currentFilename] || {};
        tracksElement.innerHTML = "";
        
        songData.tracks.forEach((track, index) => {
          const key = trackKey(track, index);
          const row = document.createElement("div");
          row.className = "track";
          const selectedSoundfont = getTrackSoundfont(track, rules, key);
          const trackVolume = getTrackVolume(track, rules, key);
          
          const statusHTML = isReady 
            ? `<span class="track-status ready">Ready</span>` 
            : `<span class="track-status loading">Loading...</span>`;
          
          row.innerHTML = `
            <input class="track-enabled" data-index="${index}" type="checkbox" ${rules[key] !== false ? "checked" : ""} aria-label="Mainkan channel ${index + 1}">
            <div>
              <span class="track-name">Channel ${track.channel + 1}: ${track.instrument.name} ${statusHTML}</span>
              <span class="track-meta">${track.name || `Track ${index + 1}`} · ${track.instrument.family} · ${track.notes.length} notes</span>
              <span class="soundfont-label">Pilih SoundFont SF2:</span>
              <div class="soundfont-mark">
                ${SOUNDFONTS.map((sf) => 
                  `<button class="soundfont-button ${selectedSoundfont === sf.file ? "active" : ""}" data-soundfont="${sf.file}" type="button">${sf.label}</button>`
                ).join("")}
              </div>
            </div>
            <label class="volume-control">Volume instrumen <input class="track-volume" data-key="${key}" type="range" min="0" max="200" value="${trackVolume}"><span>${trackVolume}%</span></label>
            <div class="track-actions">
              <button class="track-play" data-index="${index}" type="button" ${!isReady ? "disabled" : ""}>Play</button>
              <button class="track-stop" type="button" ${!isReady ? "disabled" : ""}>Stop</button>
            </div>`;
            
          row.querySelector(".track-enabled").addEventListener("change", (event) => {
            const allRules = savedRules();
            allRules[currentFilename] = { ...(allRules[currentFilename] || {}), [key]: event.target.checked, tracks: allRules[currentFilename]?.tracks || {} };
            saveRules(allRules);
          });
          
          row.querySelector(".track-volume").addEventListener("input", (event) => {
            const volume = Number(event.target.value);
            event.target.nextElementSibling.textContent = `${volume}%`;
            persistVolume(key, volume);
            const selected = getTrackSoundfont(track, savedRules()[currentFilename] || {}, key);
            const trackSynth = selected ? soundfontSynthesizers.get(selected) : null;
            if (trackSynth) trackSynth.controllerChange(track.channel, 7, Math.round(Math.min(volume, 100) * 1.27));
          });
          
          row.querySelectorAll(".soundfont-button").forEach((button) => button.addEventListener("click", async () => {
            const wasPlaying = playbackState && playbackState.trackIndexes.length > 0;
            const resumeOffset = wasPlaying
              ? Math.min(songData.duration, playbackState.offset + ((performance.now() - playbackState.startedAt) / 1000) * (playbackState.speed / 100))
              : 0;
              
            const allRules = savedRules();
            const file = button.dataset.soundfont;
            const current = allRules[currentFilename] || {};
            const tracks = { ...(current.tracks || {}) };
            
            // Toggle logic: jika diklik ulang pada yang sama, fallback ke Chorium
            tracks[key] = { ...(tracks[key] || {}), soundfont: tracks[key]?.soundfont === file ? DEFAULT_SOUNDFONT : file };
            allRules[currentFilename] = { ...current, tracks };
            saveRules(allRules);
            
            track.playback = { engine: "spessasynth", soundfont: tracks[key].soundfont };
            
            // Re-render and cache newly selected soundfont if not cached
            renderTracks(false);
            await preloadInstruments(false);
            renderTracks(true);
            
            if (wasPlaying && resumeOffset < songData.duration) {
              playTracks(playbackState.trackIndexes, resumeOffset, true, playbackState.speed, getGlobalPitch());
            }
          }));
          
          row.querySelector(".track-play").addEventListener("click", () => playTracks([index]));
          row.querySelector(".track-stop").addEventListener("click", () => stopAll(`Channel ${track.channel + 1} dihentikan.`));
          tracksElement.appendChild(row);
        });
      }

      async function loadSongData(data, filename, converted = false) {
        songData = data;
        currentFilename = filename;
        
        const globalVolume = getGlobalVolume();
        document.getElementById("global-volume").value = globalVolume;
        document.getElementById("global-volume-value").textContent = `${globalVolume}%`;
        const playbackSpeed = getPlaybackSpeed();
        document.getElementById("playback-speed").value = playbackSpeed;
        document.getElementById("playback-speed-value").textContent = `${playbackSpeed}%`;
        const globalPitch = getGlobalPitch();
        document.getElementById("global-pitch").value = globalPitch;
        document.getElementById("global-pitch-value").textContent = `${globalPitch > 0 ? "+" : ""}${globalPitch} semitone`;
        
        songNameElement.textContent = `${filename} · ${songData.tracks.length} channel`;
        
        // Render dengan state Loading (disabled play)
        playSelectedButton.disabled = true;
        stopAllButton.disabled = true;
        renderTracks(false); 
        
        // Preload seluruh instrument secara async dengan Progress Bar
        await preloadInstruments(converted);
        
        // Setelah preload selesai, aktifkan semua dan berikan status Ready
        renderTracks(true);
      }

      function loadMidi(buffer, filename) {
        try {
          const midi = new Midi(buffer);
          loadSongData({
            duration: midi.duration,
            tracks: midi.tracks.map((track) => ({
              name: track.name,
              channel: track.channel,
              instrument: track.instrument,
              notes: track.notes.map((note) => ({ midi: note.midi, time: note.time, duration: note.duration, velocity: note.velocity })),
              playback: { engine: "spessasynth", soundfont: DEFAULT_SOUNDFONT } // Set default untuk JSON output
            }))
          }, filename, true);
        } catch (error) {
          statusElement.textContent = "File MIDI tidak dapat dikonversi.";
          console.error(error);
        }
      }

      function readFile(file) {
        if (!file || !/\.midi?$/i.test(file.name)) {
          statusElement.textContent = "Pilih file dengan ekstensi .mid atau .midi.";
          return;
        }
        file.arrayBuffer().then((buffer) => loadMidi(buffer, file.name)).catch((error) => {
          statusElement.textContent = "File MIDI gagal dibaca.";
          console.error(error);
        });
      }

      dropZone.addEventListener("dragover", (event) => { event.preventDefault(); dropZone.classList.add("dragging"); });
      dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragging"));
      dropZone.addEventListener("drop", (event) => { event.preventDefault(); dropZone.classList.remove("dragging"); readFile(event.dataTransfer.files[0]); });
      fileInput.addEventListener("change", () => readFile(fileInput.files[0]));
      
      playSelectedButton.addEventListener("click", () => {
        const selected = [...document.querySelectorAll(".track-enabled:checked")].map((input) => Number(input.dataset.index));
        playTracks(selected);
      });
      stopAllButton.addEventListener("click", () => stopAll());
      
      const globalVolume = document.getElementById("global-volume");
      const globalVolumeValue = document.getElementById("global-volume-value");
      globalVolume.addEventListener("input", () => {
        const volume = Number(globalVolume.value);
        globalVolumeValue.textContent = `${volume}%`;
        const allRules = savedRules();
        allRules[currentFilename] = { ...(allRules[currentFilename] || {}), globalVolume: volume };
        saveRules(allRules);
        if (masterGain && audioContext) masterGain.gain.setTargetAtTime(volume / 100, audioContext.currentTime, .015);
      });
      
      const playbackSpeed = document.getElementById("playback-speed");
      const playbackSpeedValue = document.getElementById("playback-speed-value");
      const resetSpeed = document.getElementById("reset-speed");
      
      function changePlaybackSpeed(speed) {
        playbackSpeed.value = speed;
        playbackSpeedValue.textContent = `${speed}%`;
        const allRules = savedRules();
        allRules[currentFilename] = { ...(allRules[currentFilename] || {}), playbackSpeed: speed };
        saveRules(allRules);
        if (playbackState && playbackState.trackIndexes.length > 0) {
          const resumeOffset = Math.min(songData.duration, playbackState.offset + ((performance.now() - playbackState.startedAt) / 1000) * (playbackState.speed / 100));
          if (resumeOffset < songData.duration) playTracks(playbackState.trackIndexes, resumeOffset, true, speed);
        }
      }
      playbackSpeed.addEventListener("input", () => changePlaybackSpeed(Number(playbackSpeed.value)));
      resetSpeed.addEventListener("click", () => changePlaybackSpeed(100));
      
      const globalPitch = document.getElementById("global-pitch");
      const globalPitchValue = document.getElementById("global-pitch-value");
      const resetPitch = document.getElementById("reset-pitch");
      const saveJsonButton = document.getElementById("save-json");
      
      function changeGlobalPitch(pitch) {
        globalPitch.value = pitch;
        globalPitchValue.textContent = `${pitch > 0 ? "+" : ""}${pitch} semitone`;
        const allRules = savedRules();
        allRules[currentFilename] = { ...(allRules[currentFilename] || {}), globalPitch: pitch };
        saveRules(allRules);
        if (playbackState && playbackState.trackIndexes.length > 0) {
          const resumeOffset = Math.min(songData.duration, playbackState.offset + ((performance.now() - playbackState.startedAt) / 1000) * (playbackState.speed / 100));
          if (resumeOffset < songData.duration) playTracks(playbackState.trackIndexes, resumeOffset, true, playbackState.speed, pitch);
        }
      }
      globalPitch.addEventListener("input", () => changeGlobalPitch(Number(globalPitch.value)));
      resetPitch.addEventListener("click", () => changeGlobalPitch(0));

      function buildAnimationConfig() {
        const rules = savedRules()[currentFilename] || {};
        return {
          type: "singcat-midi-animation",
          version: 1,
          source: currentFilename,
          duration: songData.duration,
          global: {
            volume: rules.globalVolume ?? 100,
            speed: rules.playbackSpeed ?? 100,
            pitch: rules.globalPitch ?? 0
          },
          tracks: songData.tracks.map((track, index) => {
            const key = trackKey(track, index);
            const trackRules = rules.tracks?.[key] || {};
            const sf = getTrackSoundfont(track, rules, key);
            return {
              index,
              channel: track.channel,
              name: track.name || `Track ${index + 1}`,
              instrument: {
                name: track.instrument.name,
                family: track.instrument.family,
                number: track.instrument.number
              },
              enabled: rules[key] !== false,
              volume: trackRules.volume ?? 100,
              soundfont: sf,
              playback: { engine: "spessasynth", soundfont: sf },
              notes: track.notes
            };
          })
        };
      }

      function selectedTrackIndexes() {
        return songData.tracks
          .map((track, index) => ({ track, index }))
          .filter(({ track, index }) => {
            const rules = savedRules()[currentFilename] || {};
            return rules[trackKey(track, index)] !== false;
          })
          .map(({ index }) => index);
      }

      async function recordBrowserAudio() {
        if (!window.MediaRecorder) throw new Error("Browser tidak mendukung perekaman audio.");
        audioContext = audioContext || new AudioContext();
        await audioContext.resume();
        masterGain = masterGain || audioContext.createGain();
        masterGain.connect(audioContext.destination);
        recordingDestination = recordingDestination || audioContext.createMediaStreamDestination();
        masterGain.connect(recordingDestination);

        const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
        
        // Setting audio untuk output resolusi HD (320kbps)
        const recorder = new MediaRecorder(recordingDestination.stream, { 
          mimeType,
          audioBitsPerSecond: 320000 
        });
        
        const chunks = [];
        recorder.ondataavailable = (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        };
        const stopped = new Promise((resolve, reject) => {
          recorder.onerror = () => reject(new Error("Perekaman audio gagal."));
          recorder.onstop = () => resolve(new Blob(chunks, { type: mimeType }));
        });

        const speed = getPlaybackSpeed() / 100;
        recorder.start();
        const started = await playTracks(selectedTrackIndexes(), 0, false, getPlaybackSpeed(), getGlobalPitch());
        if (!started) {
          recorder.stop();
          await stopped;
          throw new Error("Musik tidak berhasil dimainkan untuk direkam.");
        }
        await new Promise((resolve) => setTimeout(resolve, (songData.duration / speed + 1.25) * 1000));
        recorder.stop();
        const blob = await stopped;
        stopAll("Audio selesai direkam dalam kualitas HD.");
        return blob;
      }

      async function uploadBrowserAudio(blob) {
        const response = await fetch(`/api/midi-audio?filename=${encodeURIComponent(currentFilename)}`, {
          method: "POST",
          headers: { "Content-Type": blob.type || "audio/webm" },
          body: blob
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Audio gagal disimpan.");
        return result.audio;
      }

      saveJsonButton.addEventListener("click", async () => {
        if (!songData || !currentFilename) {
          statusElement.textContent = "Muat file MIDI terlebih dahulu.";
          return;
        }
        saveJsonButton.disabled = true;
        try {
          const response = await fetch("/api/midi-config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: currentFilename, config: buildAnimationConfig() })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Gagal menyimpan JSON");
          
          statusElement.textContent = "Merekam audio (Kualitas HD)...";
          const recordedAudio = await recordBrowserAudio();
          const audio = await uploadBrowserAudio(recordedAudio);
          statusElement.textContent = `Berhasil! JSON dan Audio HD tersimpan di publick/assets/${result.file}.`;
        } catch (error) {
          statusElement.textContent = "Proses penyimpanan gagal.";
          console.error(error);
        } finally {
          saveJsonButton.disabled = false;
        }
      });

      const socket = io();
      socket.on("connect", () => document.getElementById("server-status").textContent = "online");
      socket.on("disconnect", () => document.getElementById("server-status").textContent = "offline");

      // Optional fallback startup
      fetch("/assets/Pinkfong-Babyshark.json")
        .then((response) => response.ok ? response.json() : Promise.reject(new Error("Bundled MIDI JSON unavailable")))
        .then((data) => {
          loadSongData(data, data.source || "Pinkfong-Babyshark.mid");
        })
        .catch(() => { statusElement.textContent = "Silakan jatuhkan file MIDI untuk memulai."; });
    </script>
  </body>
</html>
